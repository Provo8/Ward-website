name: Appointment Reminders

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

jobs:
  send-reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger reminder check
        run: |
          curl -sf -X POST "https://provo8ward.vercel.app/api/send-reminders" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}"
